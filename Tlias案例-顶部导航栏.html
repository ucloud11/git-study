<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tlias智能学习辅助系统</title>
    <style>
        * {
            box-sizing: border-box;
        }

        .navbar {
            background-color: #d4edda;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }

        .navbar .title {
            font-family: "楷体", KaiTi, serif;
            font-size: 24px;
            font-weight: bold;
        }

        .navbar a {
            text-decoration: none;
            color: #333;
        }

        .navbar a:hover {
            color: #007bff;
        }

        .search-bar {
            background-color: #f8f9fa;
            padding: 15px 20px;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-bar label {
            font-size: 14px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .search-bar input,
        .search-bar select {
            padding: 6px 10px;
            font-size: 14px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            outline: none;
            width: 160px;
        }

        .search-bar input:focus,
        .search-bar select:focus {
            border-color: #80bdff;
            box-shadow: 0 0 3px rgba(0, 123, 255, 0.25);
        }

        .search-bar .btn-group {
            margin-left: auto;
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 7px 18px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            color: #fff;
        }

        .btn-query {
            background-color: #007bff;
        }

        .btn-query:hover {
            background-color: #0056b3;
        }

        .btn-clear {
            background-color: #6c757d;
        }

        .btn-clear:hover {
            background-color: #545b62;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        table th,
        table td {
            border: 1px solid #dee2e6;
            padding: 10px;
            text-align: center;
        }

        table th {
            background-color: #f1f3f5;
            font-weight: bold;
        }

        table tbody tr:hover {
            background-color: #e9ecef;
        }

        table img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        .action a {
            margin: 0 5px;
            text-decoration: none;
            font-size: 13px;
        }

        .action .edit {
            color: #007bff;
        }

        .action .delete {
            color: #dc3545;
        }

        .action .edit:hover {
            text-decoration: underline;
        }

        .action .delete:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="navbar">
            <div class="title">tlias智能学习辅助系统</div>
            <a href="#">退出登录</a>
        </div>

        <div class="search-bar">
            <label>姓名: <input type="text" v-model="searchName" placeholder="请输入姓名"></label>
            <label>性别:
                <select v-model="searchGender">
                    <option value="">全部</option>
                    <option value="1">男</option>
                    <option value="2">女</option>
                </select>
            </label>
            <label>职位:
                <select v-model="searchJob">
                    <option value="">全部</option>
                    <option value="1">班主任</option>
                    <option value="2">讲师</option>
                    <option value="3">学工主管</option>
                    <option value="4">教研主管</option>
                    <option value="5">管理员</option>
                </select>
            </label>
            <div class="btn-group">
                <button class="btn btn-query" @click="query">查询</button>
                <button class="btn btn-clear" @click="clear">清空</button>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>姓名</th>
                    <th>性别</th>
                    <th>头像</th>
                    <th>职位</th>
                    <th>入职日期</th>
                    <th>最后操作时间</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr v-for="(emp, index) in employees" :key="index">
                    <td>{{ emp.name }}</td>
                    <td>{{ emp.gender === 1 ? '男' : '女' }}</td>
                    <td><img :src="emp.image" alt="头像"></td>
                    <td>{{ emp.job }}</td>
                    <td>{{ emp.entryDate }}</td>
                    <td>{{ emp.updateTime }}</td>
                    <td class="action">
                        <a href="#" class="edit" @click.prevent="editEmp(emp)">编辑</a>
                        <a href="#" class="delete" @click.prevent="deleteEmp(index)">删除</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
        const { createApp, ref } = Vue;

        createApp({
            setup() {
                const searchName = ref('');
                const searchGender = ref('');
                const searchJob = ref('');

                const employees = ref([
                    {
                        name: '张强',
                        gender: 1,
                        image: 'https://api.dicebear.com/7.x/avataaars/svg?seed=zhangqiang&backgroundColor=b6e3f4',
                        job: '班主任',
                        entryDate: '2023-03-15',
                        updateTime: '2026-07-20 14:30:25'
                    },
                    {
                        name: '李娜',
                        gender: 2,
                        image: 'https://api.dicebear.com/7.x/avataaars/svg?seed=lina&backgroundColor=ffd5dc',
                        job: '讲师',
                        entryDate: '2022-08-20',
                        updateTime: '2026-07-18 09:12:40'
                    },
                    {
                        name: '王峰',
                        gender: 1,
                        image: 'https://api.dicebear.com/7.x/avataaars/svg?seed=wangfeng&backgroundColor=c0aede',
                        job: '学工主管',
                        entryDate: '2021-06-10',
                        updateTime: '2026-07-25 16:45:10'
                    },
                    {
                        name: '赵敏',
                        gender: 2,
                        image: 'https://api.dicebear.com/7.x/avataaars/svg?seed=zhaomin&backgroundColor=ffdfbf',
                        job: '教研主管',
                        entryDate: '2020-11-05',
                        updateTime: '2026-07-28 11:05:33'
                    },
                    {
                        name: '孙涛',
                        gender: 1,
                        image: 'https://api.dicebear.com/7.x/avataaars/svg?seed=suntao&backgroundColor=d1d4f9',
                        job: '管理员',
                        entryDate: '2019-04-18',
                        updateTime: '2026-07-30 08:22:17'
                    }
                ]);

                const query = () => {
                    alert(`查询条件 - 姓名: ${searchName.value}, 性别: ${searchGender.value}, 职位: ${searchJob.value}`);
                };

                const clear = () => {
                    searchName.value = '';
                    searchGender.value = '';
                    searchJob.value = '';
                };

                const editEmp = (emp) => {
                    alert(`编辑: ${emp.name}`);
                };

                const deleteEmp = (index) => {
                    if (confirm(`确定删除 ${employees.value[index].name} 吗?`)) {
                        employees.value.splice(index, 1);
                    }
                };

                return {
                    searchName,
                    searchGender,
                    searchJob,
                    employees,
                    query,
                    clear,
                    editEmp,
                    deleteEmp
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
